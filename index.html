<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>청도 해커톤</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #20352c;
      background: #f6f7f2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 85% 15%, #e1edcf 0, transparent 38%),
        radial-gradient(ellipse at 10% 90%, #e8eee1 0, transparent 36%),
        #f6f7f2;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(32px, 8vw, 76px);
      border: 1px solid #dfe6d9;
      border-radius: 28px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 24px 70px rgb(34 58 41 / 8%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #56804b;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 5rem);
      line-height: 1.12;
      letter-spacing: -0.07em;
      word-break: keep-all;
    }

    .intro {
      max-width: 34rem;
      margin: 24px auto 0;
      color: #58665c;
      font-size: clamp(1rem, 2.8vw, 1.18rem);
      line-height: 1.9;
      word-break: keep-all;
    }

    .accent {
      width: 48px;
      height: 4px;
      margin: 32px auto 0;
      border-radius: 999px;
      background: #78a363;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      main { border-radius: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">IDEAS · PEOPLE · CHEONGDO</p>
    <h1>청도 해커톤</h1>
    <p class="intro">반가워요! 청도에서 함께 아이디어를 나누고, 새로운 가능성을 만들어봐요.</p>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
